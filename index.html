<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3B82F6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Track your transit route timing and stay on schedule">
	<link rel="manifest" href="./manifest.json">
	<link rel="icon" href="./favicon.png">
	<link rel="apple-touch-icon" href="./icon-192.png">
    <title>Transit Pace</title>
    <script src="https://cdn.tailwindcss.com"></script>
	<style>
		@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
		.animate-pulse { animation: pulse 2s ease-in-out infinite; }

		* { -webkit-tap-highlight-color: transparent; }

		body {
			font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
			background: #f5f5f5;
			color: #111;
		}
	</style>
	<script>
		if('serviceWorker' in navigator) {
			navigator.serviceWorker.register('./service-worker.js');
		}
	</script>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;
        
		const Icons = {
			play: (
				<svg viewBox="0 0 24 24" className="w-5 h-5">
					<polygon points="6,4 20,12 6,20" fill="currentColor"/>
				</svg>
			),
			pause: (
				<svg viewBox="0 0 24 24" className="w-5 h-5">
					<rect x="6" y="4" width="4" height="16" fill="currentColor"/>
					<rect x="14" y="4" width="4" height="16" fill="currentColor"/>
				</svg>
			),
			stop: (
				<svg viewBox="0 0 24 24" className="w-5 h-5">
					<rect x="6" y="6" width="12" height="12" fill="currentColor"/>
				</svg>
			),
			check: (
				<svg viewBox="0 0 24 24" className="w-5 h-5">
					<polyline points="5,13 10,18 19,7" fill="none" stroke="currentColor" strokeWidth="2"/>
				</svg>
			),
			edit: (
				<svg viewBox="0 0 24 24" className="w-5 h-5">
					<path d="M3 17v4h4L17 7l-4-4L3 17z" fill="currentColor"/>
				</svg>
			),
			trash: (
				<svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
					<polyline points="3 6 5 6 21 6" />
					<path d="M19 6l-1 14H6L5 6" />
					<path d="M10 11v6" />
					<path d="M14 11v6" />
					<path d="M9 6V4h6v2" />
				</svg>
			),
			restore: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M3 12a9 9 0 1 0 3-6.7" />
				<polyline points="3 3 3 9 9 9" />
			  </svg>
			),
			backup: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M4 7h16v14H4z" />
				<path d="M8 3h8v4H8z" />
				<path d="M9 13h6" />
			  </svg>
			),
			history: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<circle cx="12" cy="12" r="9" />
				<path d="M12 7v5l3 3" />
			  </svg>
			),
			add: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M12 5v14" />
				<path d="M5 12h14" />
			  </svg>
			),
			close: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M6 6l12 12" />
				<path d="M18 6L6 18" />
			  </svg>
			),
			back: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M15 18l-6-6 6-6" />
			  </svg>
			),
			onTime: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<circle cx="12" cy="12" r="9" />
				<path d="M8 12l3 3 5-6" />
			  </svg>
			),
			early: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M10 17l-5-5 5-5" />
				<path d="M19 17l-5-5 5-5" />
			  </svg>
			),
			late: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<circle cx="12" cy="12" r="9" />
				<path d="M12 7v5l-3 3" />
				<path d="M9 16h6" />
			  </svg>
			),
			save: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M4 4h14l2 2v14H4z" />
				<path d="M7 4v6h10V4" />
				<path d="M8 14h8v6H8z" />
			  </svg>
			),
			duplicate: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<rect x="8" y="8" width="10" height="10" rx="1" />
				<rect x="4" y="4" width="10" height="10" rx="1" />
			  </svg>
			),
			flip: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
				<path d="M12 3v18" />
				<path d="M4 7l6 5-6 5z" />
				<path d="M20 7l-6 5 6 5z" />
			  </svg>
			),
			options: (
			  <svg viewBox="0 0 24 24" className="w-5 h-5" fill="currentColor">
				<circle cx="12" cy="5" r="1.5"/>
				<circle cx="12" cy="12" r="1.5"/>
				<circle cx="12" cy="19" r="1.5"/>
			  </svg>
			),
		};
		const IconButton = ({ icon, onClick, bg="bg-neutral-100", color="" }) => (
			<button
				onClick={onClick}
				className={`w-11 h-11 flex items-center justify-center rounded-md ${bg} ${color} active:scale-95`}
			>
				{Icons[icon]}
			</button>
		);
		
		const ON_TIME_THRESHOLD = 3; // seconds
		
		const haversineKm = (lat1, lon1, lat2, lon2) => {
			const R = 6371;
			const dLat = (lat2 - lat1) * Math.PI / 180;
			const dLon = (lon2 - lon1) * Math.PI / 180;
			const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
				Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
				Math.sin(dLon/2) * Math.sin(dLon/2);
			return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
		};
		
        function App() {
            const [routes, setRoutes] = useState([]);
            const [history, setHistory] = useState([]);
            const [active, setActive] = useState(null);
            const [view, setView] = useState('routes'); // routes, history, creating, routeview
            const [historyDetail, setHistoryDetail] = useState(null);
            const [creating, setCreating] = useState(false);
            const [editing, setEditing] = useState(null);
            const [name, setName] = useState('');
            const [cps, setCps] = useState([{name:'', type:'start', dist:0, exp:0}, {name:'', type:'fixed', time:600, dist:5, rate:2, halt:{enabled:false, time:300}, subPoints:[]}]);
            const [start, setStart] = useState(null);
            const [curr, setCurr] = useState(0);
            const [cpTimes, setCpTimes] = useState([]);
            const [paused, setPaused] = useState(false);
            const [pauseTotal, setPauseTotal] = useState(0);
            const [pauseStart, setPauseStart] = useState(null);
            const [now, setNow] = useState(Date.now());
			const [haltActive, setHaltActive] = useState(false);
			const [haltStart, setHaltStart] = useState(null);
			const [expandedSubPoints, setExpandedSubPoints] = useState({});
			const [expandedSegments, setExpandedSegments] = useState({});
			const [routeMenu, setRouteMenu] = useState(null);
			const [viewRoute, setViewRoute] = useState(null);
			const [scheduledStart, setScheduledStart] = useState(null);
			const [useScheduledStart, setUseScheduledStart] = useState(false);
			const [actualTapTime, setActualTapTime] = useState(null);
			const [wasScheduled, setWasScheduled] = useState(false);
			const [gpsRate, setGpsRate] = useState(null);
			const [gpsSegmentPositions, setGpsSegmentPositions] = useState([]);
			const gpsSegmentPositionsRef = React.useRef([]);
			const [gpsWatchId, setGpsWatchId] = useState(null);
			const gpsSegmentStartRef = React.useRef(null);
			const gpsWarmupRef = React.useRef(0);
			const gpsLastValidRef = React.useRef(null);
			const [startFromCp, setStartFromCp] = useState(0);
			const [regFlash, setRegFlash] = useState(false);
			const stopRouteRef = React.useRef(stopRoute);
			const handlePopStateRef = React.useRef(null);
			
			useEffect(() => { stopRouteRef.current = stopRoute; }, [stopRoute]);

			useEffect(() => {
				if(!active) return;

				// Add a history entry while a route is active. When Back is pressed,
				// ask first. If cancelled, move forward to restore the active-route
				// entry instead of pushing a new entry during popstate. This keeps
				// the Back guard reliable on Android back gestures as well as buttons.
				window.history.pushState({activeRoute: true}, '');
				restoringHistoryRef.current = false;

				const handlePopState = () => {
					if(restoringHistoryRef.current) {
						restoringHistoryRef.current = false;
						return;
					}

					const answer = confirm('Stop the current route and exit?');
					if(answer) {
						stopRouteRef.current();
					} else {
						// The Back action already moved one entry backward. Restore the
						// active-route entry without adding another history entry.
						restoringHistoryRef.current = true;
						window.history.go(1);
					}
				};

				window.addEventListener('popstate', handlePopState);
				return () => {
					window.removeEventListener('popstate', handlePopState);
				};
			}, [active]);

            useEffect(() => {
                const s = localStorage.getItem('routes');
                if(s) setRoutes(JSON.parse(s));
                const h = localStorage.getItem('history');
                if(h) setHistory(JSON.parse(h));
            }, []);

            useEffect(() => {
				if((active && !paused) || view === 'routeview') {
					const i = setInterval(() => setNow(Date.now()), 100);
					return () => clearInterval(i);
				}
			}, [active, paused, view]);
			
			useEffect(() => {
				let wakeLock = null;
				const requestWakeLock = async () => {
					if('wakeLock' in navigator && active) {
						try {
							wakeLock = await navigator.wakeLock.request('screen');
						} catch(err) {
							console.log('Wake lock failed:', err);
						}
					}
				};
				requestWakeLock();
				return () => {
					if(wakeLock) wakeLock.release();
				};
			}, [active]);
			
			useEffect(() => {
				if(!active || !navigator.geolocation) return;

				if(paused) {
					if(gpsWatchId !== null) {
						navigator.geolocation.clearWatch(gpsWatchId);
						setGpsWatchId(null);
					}
					return;
				}

				const MIN_ACCURACY = 50; // meters
				const MIN_SEGMENT_DIST_KM = 0.01; // 10 meters minimum before showing rate

				const id = navigator.geolocation.watchPosition(
					pos => {
						if(pos.coords.accuracy > MIN_ACCURACY) return;

						// Warmup — skip first 5 fixes
						gpsWarmupRef.current += 1;
						if(gpsWarmupRef.current <= 5) return;

						const newPoint = {
							lat: pos.coords.latitude,
							lon: pos.coords.longitude,
							time: Date.now()
						};

						// Speed sanity check — discard if implies > 150 km/h
						if(gpsLastValidRef.current) {
							const dist = haversineKm(
								gpsLastValidRef.current.lat, gpsLastValidRef.current.lon,
								newPoint.lat, newPoint.lon
							);
							const timeDiffHr = (newPoint.time - gpsLastValidRef.current.time) / 3600000;
							if(timeDiffHr > 0 && dist / timeDiffHr > 150) return;
						}
						gpsLastValidRef.current = newPoint;

						const updated = [...gpsSegmentPositionsRef.current, newPoint];
						gpsSegmentPositionsRef.current = updated;
						setGpsSegmentPositions(updated);

						if(updated.length < 2) return;

						let totalDist = 0;
						for(let i = 1; i < updated.length; i++) {
							totalDist += haversineKm(
								updated[i-1].lat, updated[i-1].lon,
								updated[i].lat, updated[i].lon
							);
						}

						if(totalDist < MIN_SEGMENT_DIST_KM) return;

						const segmentElapsed = (Date.now() - (gpsSegmentStartRef.current || Date.now())) / 60000;
						if(segmentElapsed > 0) {
							setGpsRate(segmentElapsed / totalDist);
						}
					},
					err => console.log('GPS error:', err),
					{ enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
				);

				setGpsWatchId(id);
				return () => navigator.geolocation.clearWatch(id);
			}, [active, paused]);

            const save = r => { setRoutes(r); localStorage.setItem('routes', JSON.stringify(r)); };
            const saveHistory = h => { setHistory(h); localStorage.setItem('history', JSON.stringify(h)); };
            
            const backupToSheets = () => {
                const data = {
                    routes,
                    history,
                    timestamp: new Date().toISOString()
                };
                const jsonStr = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `transit-pace-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                alert('Backup downloaded!');
            };

            const restoreFromSheets = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = event => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if(data.routes && Array.isArray(data.routes)) {
                                if(confirm(`Restore ${data.routes.length} routes and ${data.history?.length || 0} history entries? This will merge with existing data.`)) {
                                    const mergedRoutes = [...routes];
                                    data.routes.forEach(r => {
                                        if(!mergedRoutes.some(x => x.id === r.id)) {
                                            mergedRoutes.push(r);
                                        }
                                    });
                                    save(mergedRoutes);
                                    
                                    if(data.history && Array.isArray(data.history)) {
                                        const mergedHistory = [...history];
                                        data.history.forEach(h => {
                                            if(!mergedHistory.find(x => x.id === h.id)) {
                                                mergedHistory.push(h);
                                            }
                                        });
                                        saveHistory(mergedHistory);
                                    }
                                    alert('Restore complete!');
                                }
                            } else {
                                alert('Invalid backup file format');
                            }
                        } catch(err) {
                            alert('Error reading backup file: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };
            
            const saveRoute = () => {
				if(!name.trim() || cps.some(c => !c.name.trim())) return alert('Fill all fields');
				if(cps.filter(c => c.type !== 'start').length === 0) return alert('Add at least one checkpoint');
				const route = {
					id: editing?.id || Date.now(),
					name,
					cps: cps.map(c => c.type === 'start'
						? {...c, exp: 0}
						: {...c, exp: (c.type === 'fixed' ? (c.time / 60) : (c.dist * c.rate)) + (c.halt?.enabled ? c.halt.time / 60 : 0), subPoints: c.subPoints || []}
					)
				};
				save(editing ? routes.map(r => r.id === route.id ? route : r) : [...routes, route]);
				setName(''); setCps([{name:'', type:'start', dist:0, exp:0}, {name:'', type:'fixed', time:600, dist:5, rate:2, halt:{enabled:false, time:300}, subPoints:[]}]); setCreating(false); setEditing(null);
			};
			const duplicateRoute = r => {
				const copy = {
					...JSON.parse(JSON.stringify(r)),
					id: Date.now(),
					name: `${r.name} (Copy)`
				};
				save([...routes, copy]);
			};

			const flipRoute = r => {
				const cps = r.cps;
				const flipped = [...cps].reverse().map((c, i, arr) => {
					if(i === 0) {
						return {
							...c,
							type: 'start',
							exp: 0,
							dist: 0,
							rate: 0,
							time: 0,
							subPoints: [],
							halt: {enabled: false, time: 300}
						};
					}
					const donor = arr[i - 1];
					const donorHaltTime = donor.halt?.enabled ? donor.halt.time / 60 : 0;
					const donorTravelExp = donor.exp - donorHaltTime;
					return {
						...c,
						type: donor.type === 'start' ? 'fixed' : donor.type,
						exp: donorTravelExp + (c.halt?.enabled ? c.halt.time / 60 : 0),
						dist: donor.dist || 0,
						rate: donor.rate || 0,
						time: donor.time || 0,
						subPoints: donor.type !== 'start' ? (() => {
							const sps = donor.subPoints || [];
							if(sps.length === 0) return [];
							const totalDist = donor.dist || 0;
							// Build cumulative distances from original start
							let cum = 0;
							const cumArr = sps.map(sp => {
								cum += sp.dist || 0;
								return cum;
							});
							// Reverse cumulative positions and calculate new segment distances
							const revCum = [...cumArr].reverse().map(c => totalDist - c);
							const reversedSps = [...sps].reverse();
							return reversedSps.map((sp, si) => ({
								...sp,
								dist: parseFloat((revCum[si] - (si > 0 ? revCum[si - 1] : 0)).toFixed(6))
							}));
						})() : [],
						halt: c.halt
					};
				});
				const flippedRoute = {
					...JSON.parse(JSON.stringify(r)),
					id: Date.now(),
					name: `${r.name} (Flipped)`,
					cps: flipped
				};
				save([...routes, flippedRoute]);
			};
            const startRoute = r => {
				const now = Date.now();
				const actualStart = (useScheduledStart && scheduledStart) ? scheduledStart : now;
				setActualTapTime(now);
				setWasScheduled(useScheduledStart && !!scheduledStart);
				setActive(r); setStart(actualStart); setCurr(1);
				setCpTimes([{cp: 0, time: 0, real: actualStart}]);
				setPaused(false); setPauseTotal(0); setPauseStart(null); setNow(now);
				setHaltActive(false); setHaltStart(null);
				setGpsRate(null);
				gpsSegmentPositionsRef.current = [];
				setGpsSegmentPositions([]);
				gpsSegmentStartRef.current = Date.now();
				setUseScheduledStart(false); setScheduledStart(null);
				gpsWarmupRef.current = 0;
				gpsLastValidRef.current = null;
			};

            const togglePause = () => {
                if(paused) {
                    setPauseTotal(pauseTotal + (Date.now() - pauseStart));
                    setPauseStart(null); setPaused(false);
                } else {
                    setPauseStart(Date.now()); setPaused(true);
                }
            };

            const reg = () => {
				// Haptic + visual feedback
				if(navigator.vibrate) navigator.vibrate(100);
				setRegFlash(true);
				setTimeout(() => setRegFlash(false), 300);
				const t = (Date.now() - start - pauseTotal) / 60000;
				const newCpTimes = [...cpTimes, {cp: curr, time: t, real: Date.now()}];
				setCpTimes(newCpTimes);
				// Soft reset — keep last position as new segment start
				const lastPos = gpsSegmentPositionsRef.current;
				const seed = lastPos.length > 0 ? [{...lastPos[lastPos.length - 1]}] : [];
				gpsSegmentPositionsRef.current = seed;
				setGpsSegmentPositions(seed);
				gpsSegmentStartRef.current = Date.now();
				setGpsRate(null);
				gpsLastValidRef.current = null;
				gpsWarmupRef.current = 5; // skip warmup for subsequent segments
				if(active.cps[curr]?.halt?.enabled) {
					setHaltActive(true);
					setHaltStart(Date.now());
					if(curr < active.cps.length - 1) setCurr(curr + 1);
				} else {
					if(curr < active.cps.length - 1) setCurr(curr + 1);
				}
			};
			const depart = () => {
				if(navigator.vibrate) navigator.vibrate(100);
				setRegFlash(true);
				setTimeout(() => setRegFlash(false), 300);
				const haltActual = (Date.now() - haltStart) / 60000;
				const departTime = (Date.now() - start - pauseTotal) / 60000;
				setCpTimes(cpTimes.map(ct => ct.cp === curr - 1 ? {...ct, haltDepart: Date.now(), haltActual} : ct));
				setHaltActive(false);
				setHaltStart(null);
				// Reset GPS segment from halt depart
				const lastPos = gpsSegmentPositionsRef.current;
				const seed = lastPos.length > 0 ? [{...lastPos[lastPos.length - 1]}] : [];
				gpsSegmentPositionsRef.current = seed;
				setGpsSegmentPositions(seed);
				gpsSegmentStartRef.current = Date.now();
				setGpsRate(null);
				gpsLastValidRef.current = null;
				gpsWarmupRef.current = 5; // skip warmup for subsequent segments
			};

            const stopRoute = () => {
                if(cpTimes.length > 0) {
                    const totalExp = active.cps.reduce((s, c) => s + c.exp, 0);
                    const totalActual = (Date.now() - start - pauseTotal) / 60000;
                    const totalKm = active.cps.reduce((s, c) => s + (c.dist || 0), 0);
                    const onTime = cpTimes.filter(c => {
                        let e = 0;
                        for(let i = 0; i <= c.cp; i++) e += active.cps[i].exp;
						e -= (active.cps[c.cp].halt?.enabled ? active.cps[c.cp].halt.time / 60 : 0);
                        return Math.abs((c.time - e) * 60) < ON_TIME_THRESHOLD;
                    }).length;
                    const early = cpTimes.filter(c => {
                        let e = 0;
                        for(let i = 0; i <= c.cp; i++) e += active.cps[i].exp;
						e -= (active.cps[c.cp].halt?.enabled ? active.cps[c.cp].halt.time / 60 : 0);
                        return (c.time - e) * 60 < -ON_TIME_THRESHOLD;
                    }).length;
                    const late = cpTimes.filter(c => {
                        let e = 0;
                        for(let i = 0; i <= c.cp; i++) e += active.cps[i].exp;
						e -= (active.cps[c.cp].halt?.enabled ? active.cps[c.cp].halt.time / 60 : 0);
                        return (c.time - e) * 60 > ON_TIME_THRESHOLD;
                    }).length;

                    const trip = {
						id: Date.now(),
						routeName: active.name,
						routeCps: JSON.parse(JSON.stringify(active.cps)),
						tripStart: start,
						date: new Date().toLocaleDateString(),
						time: new Date().toLocaleTimeString(),
                        checkpoints: cpTimes.map((ct, idx) => {
                            const cp = active.cps[ct.cp];
                            let exp = 0;
                            for(let i = 0; i <= ct.cp; i++) exp += active.cps[i].exp;
                            const diff = ct.time - exp;
                            const diffSec = Math.abs(diff) * 60;
                            
                            // Calculate segment time and rate
                            const prevCt = idx > 0 ? cpTimes[idx - 1] : null;
							const prevTime = prevCt
								? (prevCt.cp === 0 && wasScheduled && actualTapTime
									? (actualTapTime - start) / 60000
									: (prevCt.haltActual !== undefined ? prevCt.time + prevCt.haltActual : prevCt.time))
								: (wasScheduled && actualTapTime ? (actualTapTime - start) / 60000 : 0);
							const segmentTime = ct.time - prevTime;
							const segmentRate = cp.dist > 0 ? (segmentTime / cp.dist).toFixed(2) : 0;
                            
                            return {
								name: cp.name,
								expected: exp,
								actual: ct.time,
								realTime: ct.real,
								expectedClock: start + exp * 60000 + pauseTotal,
								diff: diff,
								status: diffSec < ON_TIME_THRESHOLD ? 'ok' : diff < 0 ? 'early' : 'late',
								km: cp.dist || 0,
								segmentTime: segmentTime,
								rate: segmentRate,
								haltPlanned: cp.halt?.enabled ? cp.halt.time / 60 : null,
								haltActual: ct.haltActual,
								haltDepart: ct.haltDepart,
							};
                        }),
                        stats: { onTime, early, late, total: cpTimes.length },
                        duration: totalActual,
                        totalKm: totalKm
                    };
                    saveHistory([trip, ...history]);
                }
                setActive(null);
				setActualTapTime(null);
				setWasScheduled(false);
				setGpsRate(null);
				gpsSegmentPositionsRef.current = [];
				setGpsSegmentPositions([]);
				gpsSegmentStartRef.current = null;
				gpsWarmupRef.current = 0;
				gpsLastValidRef.current = null;
				if(gpsWatchId !== null) {
					navigator.geolocation.clearWatch(gpsWatchId);
					setGpsWatchId(null);
				}
            };

            const fmt = ms => {
                const s = Math.floor(ms / 1000);
                return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            };

            const fmtTime = m => {
                const h = Math.floor(Math.abs(m)/60), mn = Math.floor(Math.abs(m)%60), s = Math.floor((Math.abs(m)%1)*60);
                return h > 0 ? `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            };

            const fmtReal = ms => {
                const d = new Date(ms);
                return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
            };

            const fmtRel = m => {
				const total = Math.round(m * 60);
				const h = Math.floor(total / 3600);
				const mn = Math.floor((total % 3600) / 60);
				const s = total % 60;
				return h > 0 ? `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
			};

            const getExp = i => {
				let e = 0;
				for(let j = 0; j <= i; j++) {
					e += active.cps[j].exp;
				}
				const pt = paused ? pauseTotal + (now - pauseStart) : pauseTotal;
				return fmtReal(start + e * 60000 + pt);
			};

            const getStat = i => {
				const rec = cpTimes.find(c => c.cp === i);
				if(!rec) return null;
				let e = 0;
				for(let j = 0; j <= i; j++) e += active.cps[j].exp;
				e -= (active.cps[i].halt?.enabled ? active.cps[i].halt.time / 60 : 0);
				const d = rec.time - e;
				const diffInSeconds = Math.abs(d) * 60;
				return {
					diff: Math.abs(d), 
					diffSeconds: diffInSeconds,
					stat: diffInSeconds < ON_TIME_THRESHOLD ? 'ok' : d < 0 ? 'early' : 'late'
				};
			};

            const ProgressBar = () => {
				const totalExp = active.cps.reduce((s, c) => s + c.exp, 0);
				const elapsed = Math.max(0, (now - start - pauseTotal) / 60000);
				const timeProgress = Math.min((elapsed / totalExp) * 100, 100);
				const WINDOW = Math.max(1, Math.min(5, totalExp / 4)); // minutes on each side of NOW

				// Segment rate overlay value
				const segRateDisplay = (() => {
					const cp = active.cps[curr];
					if(!cp || cp.dist === 0) return '—';
					let exp = 0;
					for(let j = 0; j <= curr; j++) exp += active.cps[j].exp;
					const travelOnly = exp - (cp.halt?.enabled ? cp.halt.time / 60 : 0);
					const prevExp = active.cps.slice(0, curr).reduce((s,c) => s + c.exp, 0);
					const segExp = travelOnly - prevExp;
					return (segExp / cp.dist).toFixed(2);
				})();

				// Build vertical bar segments
				let cumulative = 0;
				const segments = active.cps.map((c, i) => {
					if(c.type === 'start') return { startPercent: 0, endPercent: 0, isStart: true, i };
					const segmentStart = cumulative;
					const travelExp = c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
					cumulative += c.exp;
					const startPercent = (segmentStart / totalExp) * 100;
					const endPercent = ((segmentStart + travelExp) / totalExp) * 100;

					const rec = cpTimes.find(t => t.cp === i);
					const isHalting = haltActive && i === curr - 1;
					let overlayColor = null;
					let overlayStart = startPercent;
					let overlayEnd = endPercent;

					if(rec && !isHalting) {
						const actualPercent = (rec.time / totalExp) * 100;
						let e = 0;
						for(let j = 0; j <= i; j++) e += active.cps[j].exp;
						e -= (active.cps[i].halt?.enabled ? active.cps[i].halt.time / 60 : 0);
						const expectedPercent = (e / totalExp) * 100;
						const diffInSeconds = Math.abs(rec.time - e) * 60;
						if(diffInSeconds < ON_TIME_THRESHOLD) {
							overlayColor = 'bg-green-500';
						} else if(actualPercent < expectedPercent) {
							overlayColor = 'bg-blue-500';
						} else {
							overlayColor = 'bg-red-500';
						}
						if(actualPercent < expectedPercent) {
							overlayStart = actualPercent;
							overlayEnd = expectedPercent;
						} else {
							overlayStart = expectedPercent;
							overlayEnd = actualPercent;
						}
					}

					return { startPercent, endPercent, overlayColor, overlayStart, overlayEnd, rec, i, isStart: false };
				});

				// Build point list for left panel
				// Each point has an expected time (minutes from start)
				const pointList = active.cps.map((c, i) => {
					let exp = 0;
					for(let j = 0; j <= i; j++) exp += active.cps[j].exp;
					const travelOnly = exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
					return { i, name: c.name, type: c.type, exp: travelOnly, halt: c.halt, subPoints: c.subPoints || [] };
				});

				// Convert time offset to pixel offset from center
				// positive = above center (upcoming), negative = below (passed)
				const timeToY = (expMin) => {
					const diff = expMin - elapsed; // positive = future, negative = past
					const panelHalfHeight = 120; // px from center to top/bottom
					return (diff / WINDOW) * panelHalfHeight;
				};

				// Find faded fallback points
				const upcomingInWindow = pointList.filter(p => p.exp > elapsed && p.exp <= elapsed + WINDOW);
				const passedInWindow = pointList.filter(p => p.exp <= elapsed && p.exp >= elapsed - WINDOW);
				const nextPointOutside = upcomingInWindow.length === 0 ? pointList.find(p => p.exp > elapsed + WINDOW) : null;
				const lastPointOutside = passedInWindow.length === 0 ? [...pointList].reverse().find(p => p.exp < elapsed - WINDOW) : null;

				return <div className="bg-white rounded-md shadow-sm p-3 mb-3">
					{/* Rate overlay */}
					<div className="flex justify-end mb-2">
						<div className="bg-neutral-50 border border-neutral-200 rounded-md px-2 py-1 text-xs text-right">
							{(() => {
								const rec = cpTimes.length >= 1 ? cpTimes[cpTimes.length - 1] : null;
								const nextCpItem = active.cps[curr];
								let reqRate = null;
								let reqColor = 'text-blue-500';
								if(rec && nextCpItem && nextCpItem.dist) {
									let nextExp = 0;
									for(let j = 0; j <= curr; j++) nextExp += active.cps[j].exp;
									const nextTravelOnly = nextExp - (nextCpItem.halt?.enabled ? nextCpItem.halt.time / 60 : 0);
									const lastRecTime = rec.haltActual !== undefined
										? rec.time + rec.haltActual
										: (rec.cp === 0 && wasScheduled && actualTapTime
											? (actualTapTime - start) / 60000
											: rec.time);
									const timeRemaining = nextTravelOnly - lastRecTime;
									if(timeRemaining > 0) {
										reqRate = timeRemaining / nextCpItem.dist;
										const planned = (nextTravelOnly - active.cps.slice(0, curr).reduce((s,c) => s + c.exp, 0)) / nextCpItem.dist;
										const diff = reqRate - planned;
										reqColor = Math.abs(diff) < 0.05 ? 'text-green-500' : diff > 0 ? 'text-blue-500' : 'text-red-500';
									}
								}
								const gpsColor = (() => {
									if(!gpsRate || !reqRate) return 'text-blue-500';
									const diff = gpsRate - reqRate;
									return Math.abs(diff) < 0.05 ? 'text-green-500' : diff > 0 ? 'text-red-500' : 'text-blue-500';
								})();
								return <>
									<div className="text-neutral-400">GPS</div>
									<div className={`font-mono ${gpsColor}`}>
										{gpsRate ? gpsRate.toFixed(2) : <span className="text-neutral-300">—</span>}
									</div>
									<div className="text-neutral-400 mt-1">Req</div>
									<div className={`font-mono ${reqColor}`}>
										{reqRate ? reqRate.toFixed(2) : (rec && nextCpItem ? <span className="text-red-500">late</span> : '—')}
									</div>
								</>;
							})()}
						</div>
					</div>

					<div className="flex gap-2" style={{height: '240px'}}>

						{/* Left Panel — Zoomed Live Window */}
						<div className="flex-1 relative overflow-hidden border border-neutral-100 rounded-md bg-neutral-50" style={{height: '240px'}}>
							{/* NOW line */}
							<div className="absolute w-full flex items-center" style={{top: '50%', transform: 'translateY(-50%)'}}>
								<div className="flex-1 border-t-2 border-blue-500"></div>
								<div className="text-xs text-blue-500 px-1 font-semibold">▶</div>
							</div>

							{/* Points in window */}
							{pointList.map((p, idx) => {
								const y = timeToY(p.exp);
								const inWindow = Math.abs(y) <= 120;
								if(!inWindow) return null;
								const isFaded = false;
								return (
									<div key={p.i} className="absolute w-full flex items-center"
										style={{top: `calc(50% - ${y}px)`, transform: 'translateY(-50%)'}}>
										<div className="flex-1 border-t border-neutral-400"></div>
										<div className="text-xs text-neutral-600 px-2 whitespace-nowrap">
											#{p.i} {p.name}
										</div>
										<div className="w-4 border-t border-neutral-400"></div>
									</div>
								);
							})}

							{/* Sub point ticks in window */}
							{active.cps.map((c, i) => {
								if(!c.subPoints?.length) return null;
								const segStartExp = (() => {
									let e = 0;
									for(let j = 0; j < i; j++) e += active.cps[j].exp;
									return e;
								})();
								const parentTravelExp = c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
								const rate = parentTravelExp / (c.dist || 1);
								let subCumDist = 0;
								return c.subPoints.map((sp, si) => {
									subCumDist += sp.dist || 0;
									const spExp = segStartExp + (subCumDist * rate);
									const y = timeToY(spExp);
									if(Math.abs(y) > 120) return null;
									return (
										<div key={`sp-${i}-${si}`} className="absolute w-full flex items-center"
											style={{top: `calc(50% - ${y}px)`, transform: 'translateY(-50%)'}}>
											<div className="w-4 border-t border-neutral-300"></div>
											<div className="text-xs text-neutral-400 px-1 whitespace-nowrap">{sp.name}</div>
											<div className="flex-1 border-t border-dashed border-neutral-200"></div>
											<div className="w-4 border-t border-neutral-300"></div>
										</div>
									);
								});
							})}

							{/* Halt zones in window */}
							{active.cps.map((c, i) => {
								if(!c.halt?.enabled) return null;
								let cpEnd = 0;
								for(let j = 0; j <= i; j++) cpEnd += active.cps[j].exp;
								const haltDuration = c.halt.time / 60;
								const haltStartExp = cpEnd - haltDuration;
								const yStart = timeToY(haltStartExp);
								const yEnd = timeToY(cpEnd);
								const topY = Math.min(yStart, yEnd);
								const bottomY = Math.max(yStart, yEnd);
								if(topY > 120 || bottomY < -120) return null;
								const centerPx = 120; // center of panel
								const topEdge = centerPx - bottomY;
								const bottomEdge = centerPx - topY;
								const clampedTop = Math.max(0, topEdge);
								const clampedBottom = Math.min(240, bottomEdge);
								if(clampedBottom <= clampedTop) return null;
								return (
									<div key={`halt-zone-${i}`}
										className="absolute w-full bg-yellow-200 opacity-60"
										style={{top: `${clampedTop}px`, height: `${clampedBottom - clampedTop}px`}}>
									</div>
								);
							})}

							{/* Faded next point if none in window above */}
							{nextPointOutside && (
								<div className="absolute w-full flex items-center opacity-30" style={{top: '4px'}}>
									<div className="flex-1 border-t border-neutral-400"></div>
									<div className="text-xs text-neutral-600 px-2 whitespace-nowrap">
										#{nextPointOutside.i} {nextPointOutside.name}
									</div>
									<div className="w-4 border-t border-neutral-400"></div>
								</div>
							)}

							{/* Faded last point if none in window below */}
							{lastPointOutside && (
								<div className="absolute w-full flex items-center opacity-30" style={{bottom: '4px'}}>
									<div className="flex-1 border-t border-neutral-400"></div>
									<div className="text-xs text-neutral-600 px-2 whitespace-nowrap">
										#{lastPointOutside.i} {lastPointOutside.name}
									</div>
									<div className="w-4 border-t border-neutral-400"></div>
								</div>
							)}
						</div>

						{/* Right Panel — Vertical Bar */}
						<div className="relative flex flex-col" style={{width: '48px', height: '240px'}}>
							{/* Bar track */}
							<div className="absolute left-1/2 top-0 bottom-0 w-3 bg-gray-200 rounded-full" style={{transform: 'translateX(-50%)'}}>
								{/* Color overlays */}
								{segments.filter(s => !s.isStart).map((seg, i) => seg.overlayColor && (
									<div key={`overlay-${i}`}
										className={`absolute w-full ${seg.overlayColor} rounded-full`}
										style={{
											bottom: `${seg.overlayStart}%`,
											height: `${seg.overlayEnd - seg.overlayStart}%`
										}}>
									</div>
								))}
								{/* Halt yellow zone */}
								{active.cps.map((c, i) => {
									if(!c.halt?.enabled) return null;
									let cpEnd = 0;
									for(let j = 0; j <= i; j++) cpEnd += active.cps[j].exp;
									const haltDuration = c.halt.time / 60;
									const haltStartPct = ((cpEnd - haltDuration) / totalExp) * 100;
									const haltEndPct = (cpEnd / totalExp) * 100;
									return (
										<div key={`halt-bar-${i}`}
											className="absolute w-full bg-yellow-400 opacity-50"
											style={{bottom: `${haltStartPct}%`, height: `${haltEndPct - haltStartPct}%`}}>
										</div>
									);
								})}
								{/* Progress indicator */}
								<div className="absolute left-1/2 w-4 h-4 bg-white rounded-full shadow-lg border border-gray-400"
									style={{bottom: `${timeProgress}%`, transform: 'translate(-50%, 50%)'}}>
								</div>
							</div>

							{/* Checkpoint markers */}
							<div className="absolute inset-0">
								{/* Start marker */}
								<div className="absolute w-full flex items-center justify-end gap-1" style={{bottom: '0%', transform: 'translateY(50%)'}}>
									<div className="text-xs font-bold text-gray-700">0</div>
									<div className={`w-2 h-2 rounded-full ${cpTimes.find(t => t.cp === 0) ? 'bg-gray-700' : 'bg-gray-400'}`}></div>
								</div>
								{segments.filter(s => !s.isStart).map(seg => (
									<div key={seg.i} className="absolute w-full flex items-center justify-end gap-1"
										style={{bottom: `${seg.endPercent}%`, transform: 'translateY(50%)'}}>
										<div className="text-xs font-bold text-gray-700">{seg.i}</div>
										<div className={`w-2 h-2 rounded-full ${seg.rec ? 'bg-gray-700' : seg.i === curr ? 'bg-neutral-900 animate-pulse' : 'bg-gray-400'}`}></div>
									</div>
								))}
								{/* Halt h and d markers */}
								{active.cps.map((c, i) => {
									if(!c.halt?.enabled) return null;
									let cpEnd = 0;
									for(let j = 0; j <= i; j++) cpEnd += active.cps[j].exp;
									const haltEndPct = (cpEnd / totalExp) * 100;
									const rec = cpTimes.find(t => t.cp === i);
									return (
										<React.Fragment key={`halt-marker-${i}`}>
											<div className="absolute w-full flex items-center justify-end gap-1"
												style={{bottom: `${haltEndPct}%`, transform: 'translateY(50%)'}}>
												<div className="text-xs font-bold text-yellow-600">h</div>
												<div className="w-2 h-2 rounded-full bg-yellow-500"></div>
											</div>
											{rec?.haltActual !== undefined && (() => {
												const haltDepartTime = rec.time + rec.haltActual;
												const haltDepartPct = Math.min((haltDepartTime / totalExp) * 100, 100);
												return (
													<div className="absolute w-full flex items-center justify-end gap-1"
														style={{bottom: `${haltDepartPct}%`, transform: 'translateY(50%)'}}>
														<div className="text-xs font-bold text-orange-500">d</div>
														<div className="w-2 h-2 rounded-full bg-orange-500"></div>
													</div>
												);
											})()}
										</React.Fragment>
									);
								})}
								{/* Sub point dots */}
								{active.cps.map((c, i) => {
									if(!c.subPoints?.length) return null;
									const segStartExp = (() => {
										let e = 0;
										for(let j = 0; j < i; j++) e += active.cps[j].exp;
										return e;
									})();
									const parentTravelExp = c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
									const rate = parentTravelExp / (c.dist || 1);
									let subCumDist = 0;
									return c.subPoints.map((sp, si) => {
										subCumDist += sp.dist || 0;
										const spExp = segStartExp + (subCumDist * rate);
										const spPct = (spExp / totalExp) * 100;
										return (
											<div key={`sp-${i}-${si}`} className="absolute w-full flex justify-end"
												style={{bottom: `${spPct}%`, transform: 'translateY(50%)'}}>
												<div className="w-1.5 h-1.5 rounded-full bg-neutral-400 mr-0.5"></div>
											</div>
										);
									});
								})}
							</div>

							{/* Start/End labels */}
							<div className="absolute bottom-0 left-0 text-xs text-gray-500" style={{transform: 'translateY(100%)'}}>
								{fmtReal(start)}
							</div>
							<div className="absolute top-0 left-0 text-xs text-gray-500" style={{transform: 'translateY(-100%)'}}>
								{getExp(active.cps.length - 1)}
							</div>
						</div>
					</div>

					{/* Time display */}
					<div className="flex justify-between text-xs text-gray-600 mt-2">
						<span className="font-semibold">{fmtRel(elapsed)} / {fmtRel(totalExp)}</span>
					</div>
				</div>;
			};

            if(active) {
				const nextCp = curr < active.cps.length ? active.cps[curr] : null;
				const isNextRegistered = cpTimes.find(t => t.cp === curr);
				const totalKm = active.cps.reduce((s,c) => s + (c.dist || 0), 0);
				const totalExp = active.cps.reduce((s,c) => s + c.exp, 0);

				// Last registered checkpoint status
				const lastRec = cpTimes.length > 1 ? cpTimes[cpTimes.length - 1] : null;
				const lastStat = (() => {
					if(!lastRec) return null;
					// If last point had halt and halt has been departed, use halt depart status
					if(lastRec.haltActual !== undefined) {
						const cp = active.cps[lastRec.cp];
						let e = 0;
						for(let j = 0; j <= lastRec.cp; j++) e += active.cps[j].exp;
						// expected halt end is full exp including halt
						const diff = (lastRec.time + lastRec.haltActual) - e;
						const diffInSeconds = Math.abs(diff) * 60;
						return {
							diff: Math.abs(diff),
							stat: diffInSeconds < ON_TIME_THRESHOLD ? 'ok' : diff < 0 ? 'early' : 'late'
						};
					}
					// If halt is active but not departed, use checkpoint arrival status
					if(haltActive && lastRec.cp === curr - 1) {
						return getStat(lastRec.cp);
					}
					return getStat(lastRec.cp);
				})();

				// Next stop info
				const nextI = curr;
				let nextExp = 0;
				for(let j = 0; j <= nextI; j++) nextExp += active.cps[j].exp;
				const nextTravelOnly = nextExp - (active.cps[nextI]?.halt?.enabled ? active.cps[nextI].halt.time / 60 : 0);
				const prevExpNext = nextI > 0 ? active.cps.slice(0, nextI).reduce((s,c) => s + c.exp, 0) : 0;
				const nextSegExp = nextTravelOnly - prevExpNext;
				const nextSegKm = nextCp?.dist || 0;
				const nextPlannedRate = nextSegKm > 0 ? (nextSegExp / nextSegKm).toFixed(2) : '-';

				return <div className="min-h-screen bg-neutral-100">

					{/* Title Component */}
					<div className="bg-white px-4 pt-4 pb-3 shadow-sm">
						<div className="flex justify-between items-start">
							<div>
								<h2 className="text-lg font-semibold">{active.name}</h2>
								<p className="text-xs text-gray-500">{active.cps[0]?.name} → {active.cps[active.cps.length - 1]?.name}</p>
							</div>
							<div className="text-right">
								<div className="text-sm font-mono font-semibold text-blue-500">{fmtRel(totalExp)}</div>
								<div className="text-xs text-gray-500">{totalKm.toFixed(2)} km</div>
							</div>
						</div>
					</div>

					<div className="p-4 space-y-3 max-w-2xl mx-auto">

						{/* Top Card */}
						<div className="bg-white rounded-md shadow-sm p-4">
							<div className="flex justify-between items-start">
								<div>
									<div className="font-mono text-3xl font-bold text-blue-500">
										{fmt(Math.max(0, now - start - pauseTotal))}
									</div>
									{lastStat && (
										<div className={`text-xs font-medium mt-1 flex items-center gap-1 ${
											lastStat.stat === 'ok' ? 'text-green-600' :
											lastStat.stat === 'early' ? 'text-blue-600' : 'text-red-600'
										}`}>
											{lastStat.stat === 'ok' && <>{Icons.onTime} On Time</>}
											{lastStat.stat === 'early' && <>{Icons.early} Early by {fmtTime(lastStat.diff)}</>}
											{lastStat.stat === 'late' && <>{Icons.late} Late by {fmtTime(lastStat.diff)}</>}
										</div>
									)}
									{!lastStat && (
										<div className="text-xs text-gray-400 mt-1">No checkpoints registered yet</div>
									)}
								</div>
								<div className="flex gap-2">
									<IconButton
										icon={paused ? "play" : "pause"}
										onClick={togglePause}
										bg="bg-blue-500"
										color="text-white"
									/>
									<div className="relative">
										<IconButton
											icon="options"
											onClick={() => setRouteMenu('active')}
											bg="bg-neutral-100"
											color="text-neutral-600"
										/>
									</div>
								</div>
							</div>
						</div>

						{/* Active route options bottom sheet */}
						{routeMenu === 'active' && (
							<div className="fixed inset-0 z-50 flex flex-col justify-end">
								<div className="absolute inset-0 bg-black opacity-30" onClick={() => setRouteMenu(null)}/>
								<div className="relative bg-white rounded-t-2xl shadow-xl pb-8">
									<div className="px-6 py-4 border-b border-neutral-100">
										<div className="w-10 h-1 bg-neutral-300 rounded-full mx-auto mb-4"/>
										<h3 className="text-base font-semibold">{active.name}</h3>
									</div>
									<div className="px-4 pt-2">
										<button
											onClick={() => { stopRoute(); setRouteMenu(null); }}
											className="w-full flex items-center gap-4 px-4 py-4 hover:bg-neutral-50 rounded-md"
										>
											<span className="text-red-500">{Icons.stop}</span>
											<span className="text-sm text-red-500">Stop</span>
										</button>
										<button
											onClick={() => {
												setActive(null);
												setRouteMenu(null);
												setHaltActive(false);
												setHaltStart(null);
												setPaused(false);
												setPauseTotal(0);
												setPauseStart(null);
												setGpsRate(null);
												gpsSegmentPositionsRef.current = [];
												setGpsSegmentPositions([]);
												gpsSegmentStartRef.current = null;
												gpsWarmupRef.current = 0;
												gpsLastValidRef.current = null;
												setWasScheduled(false);
												setActualTapTime(null);
												if(gpsWatchId !== null) {
													navigator.geolocation.clearWatch(gpsWatchId);
													setGpsWatchId(null);
												}
											}}
											className="w-full flex items-center gap-4 px-4 py-4 hover:bg-neutral-50 rounded-md"
										>
											<span className="text-neutral-600">{Icons.close}</span>
											<span className="text-sm">Cancel</span>
										</button>
										<button
											onClick={() => { startRoute(active); setRouteMenu(null); }}
											className="w-full flex items-center gap-4 px-4 py-4 hover:bg-neutral-50 rounded-md"
										>
											<span className="text-neutral-600">{Icons.play}</span>
											<span className="text-sm">Restart</span>
										</button>
									</div>
								</div>
							</div>
						)}

						{/* Mid Card — Progress Bar */}
						<ProgressBar />

						{/* Halt Card */}
						{haltActive && (() => {
							const haltCp = active.cps[curr - 1];
							let expHaltEnd = 0;
							for(let j = 0; j < curr; j++) expHaltEnd += active.cps[j].exp;
							const haltRec = cpTimes.find(t => t.cp === curr - 1);
							const haltStartReal = haltRec?.real;
							const haltDurationMin = haltCp.halt.time / 60;
							const expHaltStart = expHaltEnd - haltDurationMin;
							return (
							<div className="bg-white border border-blue-300 rounded-md shadow-sm p-4 ring-2 ring-blue-400">
								<div className="grid grid-cols-2 gap-2">
									<div>
										<div className="font-mono text-lg text-blue-500">{fmtReal(now)}</div>
										<div className="font-mono text-sm text-neutral-500">{fmtReal(start + expHaltEnd * 60000 + pauseTotal)}</div>
										<div className="text-xs text-neutral-400 mt-1">{fmtRel(haltDurationMin)}</div>
									</div>
									<div className="flex flex-col items-end gap-1">
										{!paused && (
											<IconButton icon="check" onClick={depart} bg={regFlash ? "bg-green-500" : "bg-blue-500"} color="text-white"/>
										)}
										<div className="text-sm font-semibold text-right">Halt</div>
										<div className="text-xs text-neutral-500 text-right">{haltCp.name}</div>
									</div>
								</div>
							</div>
							);
						})()}

						{/* Bottom Card — Next Stop */}
						{!haltActive && nextCp && !isNextRegistered && (
							<div className="bg-white border border-neutral-200 rounded-md shadow-sm p-4 ring-2 ring-blue-400">
								<div className="grid grid-cols-2 gap-2">
									<div className="font-mono text-lg text-blue-500">{fmtReal(now)}</div>
									<div className="flex justify-end">
										{!paused && (
											<IconButton icon="check" onClick={reg} bg={regFlash ? "bg-green-500" : "bg-blue-500"} color="text-white"/>
										)}
									</div>
									<div className="font-mono text-sm text-neutral-500">{fmtReal(start + nextTravelOnly * 60000 + pauseTotal)}</div>
									<div className="text-sm font-semibold text-right">
										<span className="text-xs text-neutral-400 mr-1">#{nextI}</span>
										{nextCp.name}
									</div>
									<div className="text-xs text-neutral-500">{fmtRel(nextSegExp)}</div>
									<div className="text-xs text-neutral-500 text-right">{nextSegKm} km</div>
								</div>
							</div>
						)}

						{/* Checkpoint List */}
						<div className="space-y-0">
							{active.cps.map((c, i) => {
								const rec = cpTimes.find(t => t.cp === i);
								const s = getStat(i);

								let exp = 0;
								for(let j = 0; j <= i; j++) exp += active.cps[j].exp;
								const travelOnly = exp - (active.cps[i].halt?.enabled ? active.cps[i].halt.time / 60 : 0);
								const prevExp = i > 0 ? active.cps.slice(0, i).reduce((s,c) => s + c.exp, 0) : 0;
								const segmentExp = travelOnly - prevExp;
								const totalKmCp = active.cps.slice(0, i+1).reduce((s,c) => s + (c.dist||0), 0);
								const segmentKm = c.dist || 0;
								const plannedRate = segmentKm > 0 ? (segmentExp / segmentKm).toFixed(2) : '-';
								const prevRec = i > 0 ? cpTimes.find(t => t.cp === i - 1) : null;
								const prevTime = prevRec
									? (prevRec.cp === 0 && wasScheduled && actualTapTime
										? (actualTapTime - start) / 60000
										: (prevRec.haltActual !== undefined ? prevRec.time + prevRec.haltActual : prevRec.time))
									: (wasScheduled && actualTapTime ? (actualTapTime - start) / 60000 : 0);
								const registeredRate = rec && segmentKm > 0
									? ((rec.time - prevTime) / segmentKm).toFixed(2)
									: null;
								const requiredRate = (() => {
									if(c.type === 'start') return null;
									if(!segmentKm) return null;
									const prevRecItem = cpTimes.find(t => t.cp === i - 1);
									if(!prevRecItem) return null;
									let thisExp = 0;
									for(let j = 0; j <= i; j++) thisExp += active.cps[j].exp;
									const thisTravelOnly = thisExp - (c.halt?.enabled ? c.halt.time / 60 : 0);
									const prevElapsedMin = prevRecItem.haltActual !== undefined
										? prevRecItem.time + prevRecItem.haltActual
										: (prevRecItem.cp === 0 && wasScheduled && actualTapTime
											? (actualTapTime - start) / 60000
											: prevRecItem.time);
									const timeRemaining = thisTravelOnly - prevElapsedMin;
									if(timeRemaining <= 0) return null;
									return (timeRemaining / segmentKm).toFixed(2);
								})();

								const isLast = i === active.cps.length - 1;
								const showSubToggle = c.type !== 'start' && c.subPoints?.length > 0;

								const subPointBlock = showSubToggle ? (
									<>
										<div className="flex items-center justify-between px-4 py-1 cursor-pointer"
											onClick={() => setExpandedSegments({...expandedSegments, [i]: !expandedSegments[i]})}>
											<div>
												<div className="text-xs text-neutral-400">{fmtRel(segmentExp)}</div>
												{rec && <div className="text-xs text-blue-500">({fmtRel(rec.time - prevTime)})</div>}
											</div>
											<div className="text-xs text-blue-400">
												{expandedSegments[i] ? 'Hide ▲' : `Sub Points (${c.subPoints.length}) ▼`}
											</div>
											<div className="text-xs text-neutral-400">{segmentKm} km</div>
										</div>
										{expandedSegments[i] && (() => {
											const segStartExp = (() => {
												let e = 0;
												for(let j = 0; j < i; j++) e += active.cps[j].exp;
												return e;
											})();
											const parentTravelExp = c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
											const parentDist = c.dist || 1;
											const rate = parentTravelExp / parentDist;
											let subCumDist = 0;
											let prevSpExp = segStartExp;
											return c.subPoints.map((sp, si) => {
												subCumDist += sp.dist || 0;
												const spExp = segStartExp + (subCumDist * rate);
												const spSegTime = spExp - prevSpExp;
												prevSpExp = spExp;
												return (
													<div key={si} className="flex items-center gap-2 px-6 py-2 bg-neutral-50 border-l-2 border-neutral-200 ml-6">
														<div className="min-w-[56px]">
															<div className="text-xs font-mono text-neutral-500">{fmtRel(spSegTime)}</div>
															<div className="text-xs font-mono text-neutral-400">{fmtReal(start + spExp * 60000 + pauseTotal)}</div>
														</div>
														<div className="flex-1 text-center">
															<div className="text-xs text-neutral-600 font-medium">{sp.name}</div>
														</div>
														<div className="text-right min-w-[48px]">
															<div className="text-xs text-neutral-400">{(sp.dist || 0).toFixed(2)} km</div>
															<div className="text-xs text-neutral-500 font-medium">{(active.cps.slice(0, i).reduce((s,c) => s + (c.dist||0), 0) + subCumDist).toFixed(2)} km</div>
														</div>
													</div>
												);
											});
										})()}
									</>
								) : (
									i > 0 && (
										<div className="flex items-center justify-between px-4 py-1">
											<div>
												<div className="text-xs text-neutral-400">{fmtRel(segmentExp)}</div>
												{rec && <div className="text-xs text-blue-500">({fmtRel(rec.time - prevTime)})</div>}
											</div>
											<div className="text-xs text-neutral-300">—</div>
											<div className="text-xs text-neutral-400">{segmentKm} km</div>
										</div>
									)
								);

								const cpCard = (
									<div className={`bg-white rounded-md px-4 py-3 ${i === curr && !rec ? 'opacity-50' : ''}`}>
										<div className="flex items-start justify-between">
											<div className="flex items-start gap-3">
												<div className="text-right min-w-[56px]">
													<div className="text-xs font-mono text-neutral-500">{fmtReal(start + travelOnly * 60000 + pauseTotal)}</div>
													{rec && <div className="text-xs font-mono text-blue-500">({fmtReal(c.type === 'start' && actualTapTime ? actualTapTime : rec.real)})</div>}
												</div>
												<div>
													<div className="flex items-center gap-1">
														<span className="text-xs text-neutral-400">#{i}</span>
														<span className="text-sm font-semibold">{c.name}</span>
													</div>
													{c.type === 'start' && (() => {
														if(!actualTapTime || !wasScheduled) return <div className="text-xs text-green-600 font-medium">Start</div>;
														const delayMin = (actualTapTime - start) / 60000;
														const delaySec = Math.abs(delayMin) * 60;
														if(delaySec < ON_TIME_THRESHOLD) return <div className="text-xs text-green-600 font-medium flex items-center gap-1">{Icons.onTime} On Time</div>;
														if(delayMin > 0) return <div className="text-xs text-red-500 font-medium flex items-center gap-1">{Icons.late} Late {fmtTime(delayMin)}</div>;
														return <div className="text-xs text-blue-500 font-medium flex items-center gap-1">{Icons.early} Early {fmtTime(Math.abs(delayMin))}</div>;
													})()}
													{s && c.type !== 'start' && (
														<div className={`text-xs flex items-center gap-1 ${
															s.stat === 'ok' ? 'text-green-600' :
															s.stat === 'early' ? 'text-blue-600' : 'text-red-600'
														}`}>
															{s.stat === 'ok' && <>{Icons.onTime} On Time</>}
															{s.stat === 'early' && <>{Icons.early} Early {fmtTime(s.diff)}</>}
															{s.stat === 'late' && <>{Icons.late} Late {fmtTime(s.diff)}</>}
														</div>
													)}
												</div>
											</div>
											<div className="text-right min-w-[48px]">
												<div className="text-xs font-mono text-neutral-500">{totalKmCp.toFixed(2)} km</div>
												<div className="text-xs text-neutral-400">{plannedRate} min/km</div>
												{rec && registeredRate && <div className="text-xs text-blue-400">{registeredRate} act</div>}
												{requiredRate && c.type !== 'start' && (() => {
													const diff = parseFloat(requiredRate) - parseFloat(plannedRate);
													const color = Math.abs(diff) < 0.1 ? 'text-green-500' : diff > 0 ? 'text-blue-500' : 'text-red-500';
													return <div className={`text-xs font-medium ${color}`}>{requiredRate} req</div>;
												})()}
											</div>
										</div>
										{c.halt?.enabled && (() => {
											const haltDurationMin = c.halt.time / 60;
											const expHaltStart = travelOnly;
											const expHaltEnd = travelOnly + haltDurationMin;
											const haltStartReal = rec?.real;
											const haltEndReal = rec?.haltDepart;
											const haltActual = rec?.haltActual;
											const isCurrentHalt = haltActive && i === curr - 1;
											return (
												<div className="mt-2 pt-2 border-t border-neutral-100">
													{/* Segment time before halt */}
													<div className="flex justify-between text-xs text-neutral-400 mb-2">
														<div>
															<div>{fmtRel(haltDurationMin)}</div>	
														</div>
														<span>------</span>
														<div className="text-right">
															{haltActual !== undefined && (
																<div className="text-blue-500">({fmtRel(haltActual)})</div>
															)}
														</div>
													</div>
													{/* Halt card */}
													<div className="flex items-start justify-between">
														<div className="min-w-[56px]">
															<div className="text-xs font-mono text-neutral-500">
																{fmtReal(start + expHaltStart * 60000 + pauseTotal)}
															</div>
															{haltStartReal && (
																<div className="text-xs font-mono text-blue-500">
																	({fmtReal(haltStartReal)})
																</div>
															)}
														</div>
														<div className="flex-1 text-center">
															<div className="text-xs text-neutral-400">Halt</div>
															<div className="text-xs font-medium text-neutral-600">{c.name}</div>
														</div>
														<div className="min-w-[56px] text-right">
															<div className="text-xs font-mono text-neutral-500">
																{fmtReal(start + expHaltEnd * 60000 + pauseTotal)}
															</div>
															{haltEndReal && (
																<div className="text-xs font-mono text-blue-500">
																	({fmtReal(haltEndReal)})
																</div>
															)}
														</div>
													</div>
												</div>
											);
										})()}
									</div>
								);

								return (
									<React.Fragment key={i}>
										{subPointBlock}
										{cpCard}
									</React.Fragment>
								);
							})}
							<div className="bg-white rounded-md p-3">
								<div className="text-xs text-neutral-500">Total: {active.cps.reduce((s,c) => s + (c.dist || 0), 0).toFixed(2)} km</div>
							</div>
						</div>
					</div>
				</div>;
			}

			if(view === 'routeview' && viewRoute) {
				const r = viewRoute;
				const totalKm = r.cps.reduce((s,c) => s + (c.dist || 0), 0);
				const totalExp = r.cps.reduce((s,c) => s + c.exp, 0);
				const baseStart = (useScheduledStart && scheduledStart) ? scheduledStart : now - (now % 1000);
				let cpOffset = 0;
				for(let j = 0; j <= startFromCp; j++) cpOffset += r.cps[j].exp;
				const travelOnlyOffset = cpOffset - (r.cps[startFromCp]?.halt?.enabled ? r.cps[startFromCp].halt.time / 60 : 0);
				const hypotheticalStart = baseStart - travelOnlyOffset * 60000;

				return <div className="min-h-screen bg-neutral-100">

					{/* Header */}
					<div className="bg-white px-4 pt-4 pb-3 shadow-sm">
						<div className="flex justify-between items-start">
							<div>
								<h2 className="text-lg font-semibold">{r.name}</h2>
								<p className="text-xs text-gray-500">{r.cps[0]?.name} → {r.cps[r.cps.length - 1]?.name}</p>
							</div>
							<div className="text-right">
								<div className="text-sm font-mono font-semibold text-blue-500">{fmtRel(totalExp)}</div>
								<div className="text-xs text-gray-500">{totalKm.toFixed(2)} km</div>
							</div>
						</div>
						{/* Start From */}
						<div className="mt-3 flex items-center justify-between py-2 border-t border-neutral-100">
							<span className="text-xs text-neutral-500">Start From</span>
							<select
								value={startFromCp}
								onChange={e => setStartFromCp(parseInt(e.target.value))}
								className="px-2 py-1 border border-neutral-200 rounded-md text-xs"
							>
								{r.cps.map((c, i) => (
									<option key={i} value={i}>{c.name || `#${i}`}</option>
								))}
							</select>
						</div>
						{/* Scheduled Start Toggle */}
						<div className="mt-3 flex items-center justify-between py-2 border-t border-neutral-100">
							<span className="text-xs text-neutral-500">Scheduled Start</span>
							<div className="flex items-center gap-2">
								{useScheduledStart && (
									<input
										type="time"
										value={scheduledStart ? new Date(scheduledStart).toTimeString().slice(0,5) : ''}
										onChange={e => {
											if(!e.target.value) return;
											const [h, m] = e.target.value.split(':').map(Number);
											const d = new Date();
											d.setHours(h, m, 0, 0);
											setScheduledStart(d.getTime());
										}}
										className="px-2 py-1 border border-neutral-200 rounded-md text-xs font-mono"
									/>
								)}
								<button
									onClick={() => {
										if(!useScheduledStart) {
											const d = new Date();
											d.setSeconds(0, 0);
											setScheduledStart(d.getTime());
										} else {
											setScheduledStart(null);
										}
										setUseScheduledStart(!useScheduledStart);
									}}
									className={`px-3 py-1 rounded-full text-xs ${useScheduledStart ? 'bg-blue-500 text-white' : 'bg-neutral-100 text-gray-500'}`}
								>
									{useScheduledStart ? 'On' : 'Off'}
								</button>
							</div>
						</div>

						<div className="flex gap-2 mt-3">
							<button
								onClick={() => {
									if(startFromCp > 0) {
										const nowMs = Date.now();
										const actualStart = (useScheduledStart && scheduledStart) ? scheduledStart : nowMs;
										// Slice route from startFromCp, make it the new start point
										const slicedCps = r.cps.slice(startFromCp).map((c, i) => 
											i === 0 ? {...c, type: 'start', exp: 0, dist: 0, rate: 0, time: 0, subPoints: [], halt: {enabled: false, time: 300}} : c
										);
										const slicedRoute = {...r, cps: slicedCps};
										setActive(slicedRoute);
										setStart(actualStart);
										setWasScheduled(useScheduledStart && !!scheduledStart);
										setActualTapTime(nowMs);
										setCpTimes([{cp: 0, time: 0, real: actualStart}]);
										setCurr(1);
										setPaused(false); setPauseTotal(0); setPauseStart(null); setNow(nowMs);
										setHaltActive(false); setHaltStart(null);

																			color="text-white"
																		/>
																	</div>
																);
															})}
															<button
																onClick={() => {
																	const n = [...cps];
																	n[i].subPoints = [...(n[i].subPoints || []), {name: '', dist: 0}];
																	setCps(n);
																}}
																className="w-full px-3 py-2 border border-dashed border-blue-300 text-blue-500 rounded-md text-xs flex items-center justify-center gap-2"
															>
																{Icons.add} Add Sub Point
															</button>
														</div>
													)}
												</div>
											);
										})()}
											</div>
										</div>;
                            })}
                        </div>
                        <div className="bg-neutral-100 rounded-md p-4 mb-4">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-sm text-gray-600">Total Time:</span>
                                <span className="font-mono text-lg text-blue-500">{fmtRel(totalPreviewTime)}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-sm text-gray-600">Total Distance:</span>
                                <span className="font-mono text-lg text-blue-500">{previewKm.toFixed(2)} KM</span>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={saveRoute} className="flex-1 px-6 py-3 border border-neutral-200 bg-neutral-100 text-blue-500 rounded-md text-sm flex justify-center items-center gap-2">{Icons.save}Save</button>
                            <button onClick={() => {setCreating(false); setEditing(null); setName(''); setCps([{name:'', type:'start', dist:0, exp:0}, {name:'', type:'fixed', time:600, dist:5, rate:2, halt:{enabled:false, time:300}, subPoints:[]}]);}} className="px-6 py-3 border border-neutral-200 bg-neutral-100 text-sm text-neutral-900 rounded-md text-sm flex items-center gap-2">{Icons.close}Cancel</button>
                        </div>
                    </div>
                </div>;
            }

            if(view === 'history') {
				if(historyDetail) {
					const h = historyDetail;
					const tripStart = h.tripStart || 0;
					const cps = h.routeCps || [];
					const totalExp = cps.reduce((s,c) => s + c.exp, 0);
					const totalKm = cps.reduce((s,c) => s + (c.dist||0), 0);

					// Static progress bar for history
					const HistoryProgressBar = () => {
						let cumulative = 0;
						const segments = cps.map((c, i) => {
							if(c.type === 'start') return { startPercent: 0, endPercent: 0, isStart: true, i };
							const segmentStart = cumulative;
							const travelExp = c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
							cumulative += c.exp;
							const segmentEnd = cumulative;
							const startPercent = (segmentStart / totalExp) * 100;
							const endPercent = ((segmentStart + travelExp) / totalExp) * 100;

							const cp = h.checkpoints.find(ct => ct.name === c.name);
							let overlayColor = null;
							let overlayStart = startPercent;
							let overlayEnd = endPercent;

							if(cp) {
								const actualPercent = (cp.actual / totalExp) * 100;
								let e = 0;
								for(let j = 0; j <= i; j++) e += cps[j].exp;
								e -= (c.halt?.enabled ? c.halt.time / 60 : 0);
								const expectedPercent = (e / totalExp) * 100;
								const diffInSeconds = Math.abs(cp.actual - e) * 60;
								if(diffInSeconds < ON_TIME_THRESHOLD) {
									overlayColor = 'bg-green-500';
								} else if(actualPercent < expectedPercent) {
									overlayColor = 'bg-blue-500';
								} else {
									overlayColor = 'bg-red-500';
								}
								if(actualPercent < expectedPercent) {
									overlayStart = actualPercent;
									overlayEnd = expectedPercent;
								} else {
									overlayStart = expectedPercent;
									overlayEnd = actualPercent;
								}
							}

							return { startPercent, endPercent, overlayColor, overlayStart, overlayEnd, cp, i, isStart: false };
						});

						return <div className="bg-white rounded-md shadow-sm p-4 mb-3">
							<div className="relative h-3 bg-gray-300 rounded-full overflow-visible mb-1">
								{segments.filter(s => !s.isStart).map((seg, i) => seg.overlayColor && (
									<div key={`overlay-${i}`}
										className={`absolute top-0 h-full ${seg.overlayColor} rounded-full`}
										style={{ left: `${seg.overlayStart}%`, width: `${seg.overlayEnd - seg.overlayStart}%` }}>
									</div>
								))}
								{cps.map((c, i) => {
									if(!c.halt?.enabled) return null;
									let cpEnd = 0;
									for(let j = 0; j <= i; j++) cpEnd += cps[j].exp;
									const haltDuration = c.halt.time / 60;
									const haltStartPct = ((cpEnd - haltDuration) / totalExp) * 100;
									const haltEndPct = (cpEnd / totalExp) * 100;
									return (
										<div key={`halt-overlay-${i}`} className="absolute top-0 h-full bg-yellow-400 opacity-50 rounded-full"
											style={{ left: `${haltStartPct}%`, width: `${haltEndPct - haltStartPct}%` }}>
										</div>
									);
								})}
							</div>
							<div className="relative h-8 mt-1">
								<div className="absolute" style={{ left: '0%', transform: 'translateX(-50%)' }}>
									<div className="w-2 h-2 rounded-full bg-gray-700 mx-auto"></div>
									<div className="text-xs font-bold text-gray-700 text-center">0</div>
								</div>
								{segments.filter(s => !s.isStart).map(seg => (
									<div key={seg.i} className="absolute" style={{ left: `${seg.endPercent}%`, transform: 'translateX(-50%)' }}>
										<div className={`w-2 h-2 rounded-full mx-auto ${seg.cp ? 'bg-gray-700' : 'bg-gray-400'}`}></div>
										<div className="text-xs font-bold text-gray-700 text-center">{seg.i}</div>
									</div>
								))}
								{cps.map((c, i) => {
									if(!c.halt?.enabled) return null;
									let cpEnd = 0;
									for(let j = 0; j <= i; j++) cpEnd += cps[j].exp;
									const haltEndPct = (cpEnd / totalExp) * 100;
									const haltDuration = c.halt.time / 60;
									const haltStartPct = ((cpEnd - haltDuration) / totalExp) * 100;
									const cp = h.checkpoints.find(ct => ct.name === c.name);
									return (
										<React.Fragment key={`halt-marker-${i}`}>
											<div className="absolute" style={{ left: `${haltEndPct}%`, transform: 'translateX(-50%)' }}>
												<div className="w-2 h-2 rounded-full bg-yellow-500 mx-auto"></div>
												<div className="text-xs font-bold text-yellow-600 text-center">h</div>
											</div>
											{cp?.haltDepart && (() => {
												const haltDepartTime = cp.actual + cp.haltActual;
												const haltDepartPct = Math.min((haltDepartTime / totalExp) * 100, 100);
												return (
													<div className="absolute" style={{ left: `${haltDepartPct}%`, transform: 'translateX(-50%)' }}>
														<div className="w-2 h-2 rounded-full bg-orange-500 mx-auto"></div>
														<div className="text-xs font-bold text-orange-500 text-center">d</div>
													</div>
												);
											})()}
										</React.Fragment>
									);
								})}
								{cps.map((c, i) => {
									if(!c.subPoints?.length) return null;
									const segStartExp = (() => {
										let e = 0;
										for(let j = 0; j < i; j++) e += cps[j].exp;
										return e;
									})();
									const parentTravelExp = c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
									const parentDist = c.dist || 1;
									const rate = parentTravelExp / parentDist;
									let subCumDist = 0;
									return c.subPoints.map((sp, si) => {
										subCumDist += sp.dist || 0;
										const spExp = segStartExp + (subCumDist * rate);
										const spPct = (spExp / totalExp) * 100;
										return (
											<div key={`sp-${i}-${si}`} className="absolute" style={{ left: `${spPct}%`, transform: 'translateX(-50%)' }}>
												<div className="w-1.5 h-1.5 rounded-full bg-neutral-400 mx-auto mt-0.5"></div>
											</div>
										);
									});
								})}
							</div>
							<div className="flex justify-between text-xs text-gray-600 mt-2">
								<span>{fmtReal(tripStart)}</span>
								<span className="font-semibold">{fmtRel(h.duration)} / {fmtRel(totalExp)}</span>
								<span>{fmtReal(tripStart + totalExp * 60000)}</span>
							</div>
						</div>;
					};

					return <div className="min-h-screen bg-neutral-100">
						{/* Header */}
						<div className="bg-white px-4 pt-4 pb-3 shadow-sm">
							<div className="flex justify-between items-start">
								<div>
									<h2 className="text-lg font-semibold">{h.routeName}</h2>
									<p className="text-xs text-gray-500">
										{cps[0]?.name} → {cps[cps.length - 1]?.name}

									<p className="text-xs text-gray-500">{h.date} at {h.time}</p>
								</div>
								<div className="text-right">
									<div className="text-sm font-mono font-semibold text-blue-500">{fmtRel(h.duration)}</div>
									<div className="text-xs text-gray-500">{h.totalKm.toFixed(2)} km</div>
								</div>
							</div>
							<div className="flex gap-4 mt-2">
								<span className="text-xs text-green-500 flex items-center gap-1">{Icons.onTime} {h.stats.onTime}</span>
								<span className="text-xs text-blue-500 flex items-center gap-1">{Icons.early} {h.stats.early}</span>
								<span className="text-xs text-red-500 flex items-center gap-1">{Icons.late} {h.stats.late}</span>
							</div>

									{Icons.back} Back
								</button>
							</div>

							<div className="space-y-0">
