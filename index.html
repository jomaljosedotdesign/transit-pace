									for(let j = 0; j <= i; j++) exp += cps[j].exp;
									const travelOnly = exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
									const prevExp = i > 0 ? cps.slice(0, i).reduce((s,x) => s + x.exp, 0) : 0;
									const segmentExp = travelOnly - prevExp;
									const totalKmCp = cps.slice(0, i+1).reduce((s,x) => s + (x.dist||0), 0);
									const segmentKm = c.dist || 0;
									const plannedRate = segmentKm > 0 ? (segmentExp / segmentKm).toFixed(2) : '-';
									const prevCp = i > 0 ? h.checkpoints.find(ct => ct.name === cps[i-1].name) : null;
									const prevActual = prevCp
										? (prevCp.haltActual !== undefined ? prevCp.actual + prevCp.haltActual : prevCp.actual)
										: 0;
									const showSubToggle = c.type !== 'start' && c.subPoints?.length > 0;

									const subPointBlock = showSubToggle ? (
										<>
											<div
												className="flex items-center justify-between px-4 py-1 cursor-pointer"
												onClick={() => setExpandedSegments({...expandedSegments, [i]: !expandedSegments[i]})}
											>
												<div>
													<div className="text-xs text-neutral-400">{fmtRel(segmentExp)}</div>
													{cp && <div className="text-xs text-blue-500">({fmtRel(cp.actual - prevActual)})</div>}
												</div>
												<div className="text-xs text-blue-400">
													{expandedSegments[i] ? 'Hide ▲' : `Sub Points (${c.subPoints.length}) ▼`}
												</div>
												<div className="text-xs text-neutral-400">{segmentKm} km</div>
											</div>
											{expandedSegments[i] && (() => {
												const segStartExp = (() => {
													let e = 0;
													for(let j = 0; j < i; j++) e += cps[j].exp;
													return e;
												})();
												const parentTravelExp = c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0);
												const parentDist = c.dist || 1;
												const rate = parentTravelExp / parentDist;
												let subCumDist = 0;
												let prevSpExp = segStartExp;
												return c.subPoints.map((sp, si) => {
													subCumDist += sp.dist || 0;
													const spExp = segStartExp + (subCumDist * rate);
													const spSegTime = spExp - prevSpExp;
													prevSpExp = spExp;
													return (
														<div key={si} className="flex items-center gap-2 px-6 py-2 bg-neutral-50 border-l-2 border-neutral-200 ml-6">
															<div className="min-w-[56px]">
																<div className="text-xs font-mono text-neutral-500">{fmtRel(spSegTime)}</div>
																<div className="text-xs font-mono text-neutral-400">{fmtReal(tripStart + spExp * 60000)}</div>
															</div>
															<div className="flex-1 text-center">
																<div className="text-xs text-neutral-600 font-medium">{sp.name}</div>
															</div>
															<div className="text-right min-w-[48px]">
																<div className="text-xs text-neutral-400">{(sp.dist || 0).toFixed(2)} km</div>
																<div className="text-xs text-neutral-700 font-medium">{(cps.slice(0, i).reduce((s,x) => s + (x.dist||0), 0) + subCumDist).toFixed(2)} km</div>
															</div>
														</div>
													);
												});
											})()}
										</>
									) : (
										i > 0 && (
											<div className="flex items-center justify-between px-4 py-1">
												<div>
													<div className="text-xs text-neutral-400">{fmtRel(segmentExp)}</div>
													{cp && <div className="text-xs text-blue-500">({fmtRel(cp.actual - prevActual)})</div>}
												</div>
												<div className="text-xs text-neutral-300">—</div>
												<div className="text-xs text-neutral-400">{segmentKm} km</div>
											</div>
										)
									);

									const cpCard = (
										<div className="bg-white rounded-md px-4 py-3">
											<div className="flex items-start justify-between">
												<div className="flex items-start gap-3">
													<div className="text-right min-w-[56px]">
														<div className="text-xs font-mono text-neutral-400">{fmtReal(tripStart + travelOnly * 60000)}</div>
														{cp && (
															<div className="text-xs font-mono text-blue-500">({fmtReal(cp.realTime)})</div>
														)}
													</div>
													<div>
														<div className="flex items-center gap-1">
															<span className="text-xs text-neutral-400">#{i}</span>
															<span className="text-sm font-semibold">{c.name}</span>
														</div>
														{cp && (
															<div className={`text-xs flex items-center gap-1 ${
																cp.status === 'ok' ? 'text-green-600' :
																cp.status === 'early' ? 'text-blue-600' : 'text-red-600'
															}`}>
																{cp.status === 'ok' && <>{Icons.onTime} On Time</>}
																{cp.status === 'early' && <>{Icons.early} Early {fmtTime(Math.abs(cp.diff))}</>}
																{cp.status === 'late' && <>{Icons.late} Late {fmtTime(Math.abs(cp.diff))}</>}
															</div>
														)}
													</div>
												</div>
												<div className="text-right min-w-[48px]">
													<div className="text-xs font-mono text-neutral-500">{totalKmCp.toFixed(2)} km</div>
													{c.type !== 'start' && (
														<div className="text-xs text-neutral-400">{plannedRate}</div>
													)}
													{cp?.rate && (
														<div className="text-xs text-blue-400">{cp.rate}</div>
													)}
												</div>
											</div>
											{c.halt?.enabled && (() => {
												const haltDurationMin = c.halt.time / 60;
												const expHaltStart = travelOnly;
												const expHaltEnd = travelOnly + haltDurationMin;
												const haltStartReal = cp?.realTime;
												const haltEndReal = cp?.haltDepart;
												const haltActual = cp?.haltActual;
												return (
													<div className="mt-2 pt-2 border-t border-neutral-100">
														<div className="flex justify-between text-xs text-neutral-400 mb-2">
															<div>
																<div>{fmtRel(haltDurationMin)}</div>
															</div>
															<span>------</span>
															<div className="text-right">
															{haltActual !== undefined && (
																	<div className="text-blue-500">({fmtRel(haltActual)})</div>
																)}
															</div>
														</div>
														<div className="flex items-start justify-between">
															<div className="min-w-[56px]">
																<div className="text-xs font-mono text-neutral-500">{fmtReal(tripStart + expHaltStart * 60000)}</div>
																{haltStartReal && <div className="text-xs font-mono text-blue-500">({fmtReal(haltStartReal)})</div>}
															</div>
															<div className="flex-1 text-center">
																<div className="text-xs text-neutral-400">Halt</div>
																<div className="text-xs font-medium text-neutral-600">{c.name}</div>
															</div>
															<div className="min-w-[56px] text-right">
																<div className="text-xs font-mono text-neutral-500">{fmtReal(tripStart + expHaltEnd * 60000)}</div>
																{haltEndReal && <div className="text-xs font-mono text-blue-500">({fmtReal(haltEndReal)})</div>}
															</div>
														</div>
													</div>
												);
											})()}
										</div>
									);

									return (
										<React.Fragment key={i}>
											{subPointBlock}
											{cpCard}
										</React.Fragment>
									);
								})}
								<div className="bg-white rounded-md p-3">
									<div className="text-xs text-neutral-500">Total: {totalKm.toFixed(2)} km • {fmtRel(h.duration)}</div>
								</div>
							</div>
						</div>
					</div>;
				}

				return <div className="min-h-screen bg-neutral-100 p-4">
					<div className="max-w-2xl mx-auto">
						<div className="bg-white rounded-md shadow-sm p-6 mb-6">

								<h1 className="text-2xl font-semibold">Trip History</h1>
								<button onClick={() => setView('routes')}
								className="px-4 py-2 border border-neutral-200 bg-neutral-100 text-sm text-neutral-900 rounded-md text-sm flex items-center gap-2">
								{Icons.back} Back
								</button>
							</div>
						</div>
						{history.length === 0 ?
							<div className="bg-white border border-neutral-200 rounded-md shadow-sm p-12 text-center">
								<h3 className="text-xl font-semibold mb-2">No Trip History</h3>
								<p className="text-sm text-gray-600">Complete a route to see history here</p>
							</div> :
							<div className="space-y-4">
								{history.map(h => <div key={h.id} className="bg-white border border-neutral-200 rounded-md shadow-sm p-5 cursor-pointer hover:shadow-md transition" onClick={() => setHistoryDetail(h)}>
									<div className="flex justify-between items-start mb-3">
										<div>
											<h3 className="text-lg font-semibold">{h.routeName}</h3>
											<p className="text-sm text-gray-600">{h.date} at {h.time}</p>
											<p className="text-sm text-gray-600">Duration: {fmtRel(h.duration)} • {h.totalKm.toFixed(2)} km</p>

									</div>
									<div className="text-xs text-gray-600 mt-2">Tap for details</div>

							</div>

                <div className="max-w-2xl mx-auto">
                    <div className="bg-white rounded-md shadow-sm p-6 mb-6">

                            <div>
                                <h1 className="text-2xl font-semibold">Transit Pace</h1>
                                <p className="text-sm text-gray-600">Track your route timing</p>
                            </div>

								icon="add" 
								onClick={() => setCreating(true)}
								bg="bg-blue-500"
								color="text-white"
							/>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setView('history')} className="px-4 py-2 border border-neutral-200 bg-neutral-100 text-sm text-neutral-900 rounded-md text-xs flex items-center gap-2">{Icons.history} History</button>

                    </div>
                    {routes.length === 0 ?

							<h3 className="text-lg font-semibold mb-2">No Routes Yet</h3>

							</div>
						</div> :
						<div className="space-y-3">
							{routes.map(r => {
								const totalKm = r.cps.reduce((s,c) => s + (c.dist || 0), 0);
								const totalExp = r.cps.reduce((s,c) => s + (c.exp || 0), 0);
								return (
									<div key={r.id}
										className="bg-white border border-neutral-200 rounded-md shadow-sm p-4 cursor-pointer active:bg-neutral-50"

									>
										<div className="flex items-center gap-3">
											<div className="flex-1 min-w-0">
												<h3 className="text-base font-semibold truncate">{r.name}</h3>
												<p className="text-xs text-gray-500 truncate">{r.cps[0]?.name || '—'} → {r.cps[r.cps.length - 1]?.name || '—'}</p>
												<p className="text-xs text-gray-500">{fmtRel(totalExp)} • {totalKm.toFixed(2)} km</p>
											</div>
											<button
												onClick={e => { e.stopPropagation(); startRoute(r); }}
												className="w-11 h-11 flex items-center justify-center rounded-md bg-blue-500 text-white flex-shrink-0 active:scale-95"
											>
												{Icons.play}
											</button>
											<button
												onClick={e => { e.stopPropagation(); setRouteMenu(r); }}
												className="w-11 h-11 flex items-center justify-center rounded-md bg-neutral-100 text-neutral-600 flex-shrink-0 active:scale-95"
											>
												{Icons.options}
											</button>
										</div>
									</div>
								);
							})}
						</div>
					}

					{/* Bottom sheet */}
					{routeMenu && (
						<div className="fixed inset-0 z-50 flex flex-col justify-end">
							<div className="absolute inset-0 bg-black opacity-30" onClick={() => setRouteMenu(null)}/>
							<div className="relative bg-white rounded-t-2xl shadow-xl pb-8">
								<div className="px-6 py-4 border-b border-neutral-100">
									<div className="w-10 h-1 bg-neutral-300 rounded-full mx-auto mb-4"/>
									<h3 className="text-base font-semibold">{routeMenu.name}</h3>
								</div>
								<div className="px-4 pt-2">
									<button
										onClick={() => {
											setEditing(routeMenu);
											setName(routeMenu.name);
											setCps(routeMenu.cps.map(c => c.type === 'start'
												? {name: c.name, type: 'start', dist: 0, exp: 0}
												: {name: c.name, type: c.type, time: c.type === 'fixed' ? ((c.exp - (c.halt?.enabled ? c.halt.time / 60 : 0)) * 60) : (c.time || 600), dist: c.dist || 0, rate: c.rate || 0, halt: {enabled: c.halt?.enabled === true, time: c.halt?.time || 300}, subPoints: c.subPoints || []}
											));
											setCreating(true);
											setRouteMenu(null);
										}}
										className="w-full flex items-center gap-4 px-4 py-4 hover:bg-neutral-50 rounded-md"
									>
										<span className="text-neutral-600">{Icons.edit}</span>
										<span className="text-sm">Edit</span>
									</button>
									<button
										onClick={() => { duplicateRoute(routeMenu); setRouteMenu(null); }}
										className="w-full flex items-center gap-4 px-4 py-4 hover:bg-neutral-50 rounded-md"
									>
										<span className="text-neutral-600">{Icons.duplicate}</span>
										<span className="text-sm">Duplicate</span>
									</button>
									<button
										onClick={() => { flipRoute(routeMenu); setRouteMenu(null); }}
										className="w-full flex items-center gap-4 px-4 py-4 hover:bg-neutral-50 rounded-md"
									>
										<span className="text-neutral-600">{Icons.flip}</span>
										<span className="text-sm">Flip</span>
									</button>
									<button
										onClick={() => {
											if(confirm('Delete this route?')) {
												save(routes.filter(x => x.id !== routeMenu.id));
												setRouteMenu(null);
											}
										}}
										className="w-full flex items-center gap-4 px-4 py-4 hover:bg-neutral-50 rounded-md"
									>
										<span className="text-red-500">{Icons.trash}</span>
										<span className="text-sm text-red-500">Delete</span>
									</button>
								</div>
							</div>
						</div>
					)}
                </div>
            </div>;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
	<script>
		if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch((err) => { console.error('Service worker registration failed:', err); }); }); }
	</script>
</body>
</html>
